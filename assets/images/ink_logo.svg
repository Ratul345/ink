<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="#000000" rx="40"/>
  
  <!-- Main pen nib shape - modern and bold -->
  <g transform="translate(100, 100)">
    <!-- Pen tip (bottom point) -->
    <path d="M 0 45 L -20 -10 L -15 -10 L -8 10 L 0 10 L 0 45 Z" 
          fill="#ffffff"/>
    <path d="M 0 45 L 20 -10 L 15 -10 L 8 10 L 0 10 L 0 45 Z" 
          fill="#ffffff" opacity="0.85"/>
    
    <!-- Ink slit in the middle -->
    <rect x="-1.5" y="0" width="3" height="35" fill="#000000" opacity="0.3"/>
    
    <!-- Top circular hole -->
    <circle cx="0" cy="-15" r="8" fill="#4A9EFF" opacity="0.9"/>
    
    <!-- Pen body top -->
    <rect x="-20" y="-40" width="40" height="30" fill="#ffffff" opacity="0.95"/>
    
    <!-- Subtle gradient effect on pen body -->
    <rect x="-20" y="-40" width="40" height="15" fill="#ffffff" opacity="0.3"/>
    
    <!-- Accent line -->
    <line x1="-18" y1="-25" x2="18" y2="-25" stroke="#4A9EFF" stroke-width="2" opacity="0.6"/>
  </g>
  
  <!-- Ink dot accent -->
  <circle cx="160" cy="50" r="6" fill="#4A9EFF" opacity="0.7"/>
</svg>